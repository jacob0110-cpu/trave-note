<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4F57">
<title>旅行隨身筆記本</title>
<style>
:root{--bg:#EDF2F3;--paper:#fff;--ink:#14252C;--muted:#5D6F77;--line:#D5DFE2;--brand:#0E6A73;--on-brand:#fff;--soft:#E1EEF0;--head:#0B4F57;--accent:#E8A33D;--danger:#B3402F;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0E1A1F;--paper:#16262D;--ink:#E7F0F2;--muted:#93A8AF;--line:#27404A;--brand:#5CC2CB;--on-brand:#08262A;--soft:#1D3A42;--head:#0A3A41;--danger:#E8806F}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:34rem;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

header{background:var(--head);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 20px;border-radius:0 0 26px 26px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:1.3rem;font-weight:700;letter-spacing:.04em}
.reset{font-size:.8rem;padding:6px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.35);color:#fff}
.tr{display:flex;align-items:center;gap:10px}
.chip{font-size:.74rem;color:#fff;opacity:.92;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:#9db8b8}
.chip[data-s=ok]::before{background:#6ee7a8}
.chip[data-s=sync]::before{background:var(--accent)}
.chip[data-s=err]::before{background:#ff8a80}
.cloudbox{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;display:grid;gap:10px}
.cloudbox .dnote{margin:0;white-space:pre-line}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.stat small{display:block;font-size:.78rem;opacity:.75}
.stat b{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.22);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .4s}

main{padding-top:22px}
h2{font-size:1.1rem;margin-bottom:14px}
.add{display:flex;gap:8px;margin-bottom:18px}
input[type=text],input[type=number],input[type=datetime-local],select,textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);min-height:48px}
textarea{min-height:110px;resize:vertical;line-height:1.55}
select{appearance:auto}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
.btn{background:var(--brand);color:var(--on-brand);font-weight:700;border-radius:12px;padding:0 20px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.add .btn{white-space:nowrap;flex:none}
.btn:disabled{opacity:.6}
.panel{background:var(--paper);border-radius:var(--r);padding:16px;margin-bottom:20px;display:grid;gap:12px}
.panel label.f{font-size:.85rem;font-weight:600;color:var(--muted);display:grid;gap:5px}
.pick{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px dashed var(--brand);border-radius:12px;color:var(--brand);cursor:pointer;font-weight:600;background:var(--soft)}
.pick:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick input{position:absolute;opacity:0;width:1px;height:1px}

.sheet{background:var(--paper);border-radius:var(--r);padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere;text-align:left}
.row .t small{display:block;color:var(--muted);font-size:.8rem}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--muted);display:grid;place-items:center;color:var(--on-brand)}
.chk[aria-pressed=true]{background:var(--brand);border-color:var(--brand)}
.chk svg{opacity:0;stroke-width:3}.chk[aria-pressed=true] svg{opacity:1}
.done{text-decoration:line-through;color:var(--muted)}
.del{color:var(--muted);padding:10px;margin:-10px;border-radius:10px}
.del:hover{color:var(--danger)}
.ed-b{color:var(--muted);padding:10px;margin:-10px;border-radius:10px}
.ed-b:hover{color:var(--brand)}
.ed-b svg,.del svg{width:22px;height:22px}
.acts{display:flex;align-items:center;gap:22px;margin-left:6px}
#ed{overflow:auto;max-height:90vh}
#ed .panel{padding:0;margin-bottom:16px}
#ed .rm{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
#ed .rm input{width:20px;height:20px}
.pv{display:flex;flex-wrap:wrap;gap:10px}
.pv:empty{display:none}
.pvi{position:relative;width:68px;height:68px}
.pvi img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.pvi button{position:absolute;top:-9px;right:-9px;width:28px;height:28px;border-radius:50%;background:var(--danger);color:#fff;font-size:18px;line-height:1;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.fchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 4px 4px 12px;border:1px solid var(--line);border-radius:10px;font-size:.85rem;overflow-wrap:anywhere;background:var(--paper)}
.fchip button{width:30px;height:30px;color:var(--danger);font-size:18px;flex:none}
.nt{background:var(--paper);border-radius:var(--r);padding:14px;margin-bottom:12px;display:grid;gap:10px}
.nt .nh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nt .nh b{overflow-wrap:anywhere;line-height:1.4}
.nt .tx{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.nt .imgs{display:grid;gap:8px}
.nt .imgs img{width:100%;border-radius:12px;display:block;cursor:zoom-in}
.rrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px}
.rem{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--brand);background:var(--soft);padding:5px 12px;border-radius:99px}
.rem svg{width:16px;height:16px}
.rem.due{color:var(--danger);outline:1.5px solid var(--danger)}
.rem.fin{opacity:.6}
.lnk{color:var(--brand);font-weight:600;font-size:.85rem;display:inline-flex;align-items:center;gap:6px;padding:6px 0}
.fl{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.fl svg{width:20px;height:20px;flex:none;color:var(--brand)}
.fl .fn{overflow-wrap:anywhere;line-height:1.35;min-width:0}
.fl small{display:block;color:var(--muted);font-size:.75rem}
.fl button{margin-left:auto;color:var(--brand);font-weight:700;padding:8px 4px;flex:none}
#alarm{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:30;display:grid;gap:8px;max-width:32rem;margin:0 auto}
#alarm .al{background:var(--paper);border:2px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:grid;gap:6px}
#alarm .al small{color:var(--muted)}
#alarm .al-act{display:flex;gap:8px;flex-wrap:wrap}
#alarm .btn{min-height:42px;padding:0 14px;font-size:.9rem}
.flw{display:grid;gap:8px;margin-top:10px}
.tkf{padding:0 14px 14px;margin-top:0}
.ths{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.card .strip{display:flex;gap:6px;padding:6px 6px 0;overflow-x:auto}
.card .strip img{width:44px;height:44px;aspect-ratio:auto;border-radius:8px;flex:none}
.amt small{display:block;font-size:.75rem;font-weight:500;color:var(--muted)}
.amt{font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;min-width:4.5rem}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;cursor:zoom-in}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--paper);border-radius:var(--r);overflow:hidden}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in}
.ph{display:grid;place-items:center;background:var(--soft);color:var(--brand);cursor:default}
.ph svg{width:2.2em;height:2.2em}
.cap{display:flex;justify-content:space-between;gap:6px;padding:10px 12px;align-items:flex-start}
.cap b{overflow-wrap:anywhere;line-height:1.35}
.pstrip{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;-webkit-overflow-scrolling:touch}
.pstrip img{height:110px;width:auto;flex:none;border-radius:10px;object-fit:cover;cursor:zoom-in}
.sdesc{padding:0 12px 10px;font-size:.85rem}
.sdesc summary{cursor:pointer;color:var(--brand);font-weight:600;padding:2px 0}
.sdesc p{white-space:pre-wrap;margin:6px 0 0;line-height:1.6;overflow-wrap:anywhere}
.cap small{display:block;color:var(--muted);font-size:.75rem}

details.place{background:var(--paper);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.place summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-weight:600}
details.place summary::-webkit-details-marker{display:none}
details.place summary b{flex:1;overflow-wrap:anywhere}
details.place{border-left:6px solid var(--cc,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.legend:empty{display:none}
.lg{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:.88rem;font-weight:600;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px 6px 10px;min-height:40px;cursor:pointer}
.lg i{width:14px;height:14px;border-radius:50%;flex:none}
.lg[aria-pressed=true]{border-color:var(--ink)}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
details.place summary .pth{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none}
details.place summary svg:first-child{color:var(--brand)}
.chev{transition:transform .2s;color:var(--muted)}
details[open] .chev{transform:rotate(180deg)}
.pbody{padding:0 16px 16px}
.pbody iframe{width:100%;height:240px;border:0;border-radius:10px;background:var(--soft)}
.plinks{display:flex;justify-content:space-between;margin-top:10px;font-size:.9rem}
.plinks a{color:var(--brand);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.plinks button{color:var(--danger);display:inline-flex;gap:6px;align-items:center}

.empty{text-align:center;color:var(--muted);padding:36px 12px;border:1.5px dashed var(--line);border-radius:var(--r)}

nav{position:fixed;inset:auto 0 0 0;background-color:var(--paper);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));display:flex;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;z-index:5;
  /* 左右還有內容時，邊緣出現淡淡的陰影提示可以滑動 */
  background-image:linear-gradient(to right,var(--paper) 30%,transparent),linear-gradient(to left,var(--paper) 30%,transparent),radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.2),transparent),radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.2),transparent);
  background-repeat:no-repeat;background-size:36px 100%,36px 100%,12px 100%,12px 100%;background-position:left center,right center,left center,right center;background-attachment:local,local,scroll,scroll}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 20%;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.95rem;color:var(--muted);padding:4px 0;min-height:66px}
nav button i{display:grid;place-items:center;width:64px;height:36px;border-radius:99px;transition:background .2s}
nav button i svg{width:28px;height:28px}
nav button[aria-current=page]{color:var(--brand);font-weight:700}
nav button[aria-current=page] i{background:var(--soft)}

.tk{background:var(--paper);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.tk.used{opacity:.6}
.tk .head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.tk .head .t{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700;line-height:1.35}
.tk .head small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.tk img{width:100%;max-height:260px;object-fit:contain;background:#fff;display:block;border-top:1px solid var(--line);cursor:zoom-in}
.tk .note{padding:0 14px 12px;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.use{font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:99px;border:1.5px solid var(--brand);color:var(--brand);white-space:nowrap}
.use[aria-pressed=true]{background:var(--brand);color:var(--on-brand)}
input[type=date]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);min-height:48px}
dialog{border:0;padding:0;background:none;max-width:94vw;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.8)}
dialog img{max-width:94vw;max-height:88vh;border-radius:12px;display:block}
/* 全螢幕檢視器：照片、PDF、文字檔都在 App 內開啟，底部大按鈕一鍵返回 */
#lb{width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;background:#111;color:#fff}
#lb[open]{display:flex;flex-direction:column}
#lb::backdrop{background:#000}
#lb .vbody{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
#lb .vbody img{max-width:100%;max-height:100%;border-radius:0;object-fit:contain}
#lb .vbody iframe{width:100%;height:100%;border:0;background:#fff}
#lb .vbody pre{align-self:flex-start;width:100%;margin:0;padding:16px;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:.95rem;background:#fff;color:#111;min-height:100%}
#lb .vmsg{padding:24px;text-align:center;display:grid;gap:14px;justify-items:center}
#lb .vbar{display:flex;align-items:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#000}
#lb .vt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem;opacity:.8}
#lb button.vb{font:inherit;font-weight:700;color:#fff;background:rgba(255,255,255,.18);border:0;border-radius:999px;padding:10px 20px;min-height:48px;cursor:pointer}
#lb button.vb.main{background:var(--brand);color:var(--on-brand)}
#dm,#cf,#ed{background:var(--paper);color:var(--ink);border-radius:18px;padding:20px;width:min(92vw,24rem);margin:auto}
#dm::backdrop,#cf::backdrop,#ed::backdrop{background:rgba(0,0,0,.6)}
.hint{font-size:.85rem;color:var(--muted)}
.fxb{margin-top:8px;font:inherit;font-weight:600;font-size:.9rem;color:var(--brand);background:var(--soft);border:0;border-radius:999px;padding:8px 16px;min-height:40px}
.msearch{display:flex;gap:8px;margin-bottom:10px}
.msearch input{flex:1;min-width:0}
.mres{display:grid;gap:6px;margin-bottom:10px}
.mres:empty{display:none}
.mres button.rs{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);cursor:pointer;min-height:48px}
.mres button.rs b{display:block;font-weight:600;overflow-wrap:anywhere}
.mres button.rs small{display:block;color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.mres .rs .pp-i{flex:none;width:28px;height:28px;margin:0}
.mres .rs .pp-i svg{width:16px;height:16px}
.mres .rm{font-size:.85rem;color:var(--muted);padding:2px 4px}
.mres .rm a{color:var(--brand);font-weight:600}
.pp-b{font:inherit;font-weight:700;font-size:.85rem;border:0;border-radius:999px;padding:7px 14px;background:#0E6A73;color:#fff;margin:6px 6px 0 0;cursor:pointer}
.mchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mchip{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:600;font-size:.9rem;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer}
.mchip i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.mchip i svg,.mk svg,.pp-i svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lchip{font:inherit;font-weight:600;font-size:.85rem;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
.lchip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.pp-i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:6px}
.pp-i svg{width:13px;height:13px}
.mchip[aria-pressed=false]{opacity:.45}
#tmap{height:62vh;height:62dvh;min-height:360px;border-radius:14px;border:1px solid var(--line);isolation:isolate;background:var(--soft)}
.mk{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5)}
.leaflet-popup-content{color:#14252C;font:inherit;font-size:.92rem;line-height:1.55}
.leaflet-popup-content a{color:#0E6A73;font-weight:700}
.leaflet-popup-content .pp-s{color:#5D6F77;font-size:.82rem}
details.more{border:1.5px dashed var(--line);border-radius:12px;padding:0 12px}
details.more summary{cursor:pointer;font-weight:600;color:var(--brand);padding:12px 0;font-size:.92rem}
details.more .morebody{display:grid;gap:12px;padding-bottom:14px}
.kv{display:grid;grid-template-columns:5.5rem 1fr;gap:8px;font-size:.92rem;padding:6px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.kv span:first-child{color:var(--muted)}
.kv .note{white-space:pre-wrap}
.kv button.cp{margin-left:8px;font:inherit;font-size:.8rem;color:var(--brand);background:var(--soft);border:0;border-radius:99px;padding:3px 10px}
.stp{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--brand)}
.pshare{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.pshare .fxb{margin:0;display:inline-flex;align-items:center;cursor:pointer}
.filt{margin:0 0 12px}
.filt:empty{display:none}
.filt label{font-size:.8rem;font-weight:600;color:var(--muted);display:grid;gap:4px}
.filt select{min-height:44px;padding:8px 12px}
.fcount{grid-column:1/-1;font-size:.82rem;color:var(--muted);margin:0}
.hint:empty,.cands:empty{display:none}
.cands{display:grid;gap:6px}
.cand{text-align:left;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;width:100%;line-height:1.35}
.cand small{display:block;color:var(--muted);font-size:.78rem}
.cand[aria-pressed=true]{border-color:var(--brand);background:var(--soft)}
.addr{color:var(--muted);font-size:.88rem;margin-bottom:10px;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cfl{display:grid;grid-template-columns:4rem 1fr;gap:8px 10px;margin-bottom:18px}
.cfl dt{color:var(--muted);font-size:.9rem}.cfl dd{font-weight:600;overflow-wrap:anywhere}
.cfl dd.none{color:var(--muted);font-weight:400}
details.place .pnote{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:.92rem;overflow-wrap:anywhere}
details.place summary .pn{color:var(--muted);font-weight:400;font-size:.85rem;margin-left:8px}
details.place summary small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.plinks .ed{color:var(--brand);display:inline-flex;gap:6px;align-items:center}
.dnote{color:var(--muted);font-size:.9rem;margin-bottom:16px}
.dact{display:grid;gap:10px}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink);cursor:pointer}
.btn.danger{color:var(--danger);border-color:var(--danger)}
@media print{
:root{--bg:#fff;--paper:#fff;--ink:#000;--muted:#555;--line:#ccc;--brand:#0E6A73;--on-brand:#fff;--soft:#eee}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{padding:0;background:#fff;font-size:12pt}
header{background:#fff;color:#000;border-bottom:2px solid #000;border-radius:0;padding:0 0 10px}
.wrap{max-width:none}
#view-map,.reset,.chip,#alarm,.rrow .lnk,.fl button,nav,.add,.panel,.del,.ed-b,.pv,.use,.chev,.plinks button,.bar,dialog{display:none!important}
main section[hidden]{display:block!important}
main section{margin-bottom:20px}
.sheet,.card,.tk,details.place{border:1px solid var(--line)}
.row,.card,.tk,details.place{break-inside:avoid}
.grid{grid-template-columns:repeat(3,1fr)}
.tk.used{opacity:1}
.tk.used .head .t::after{content:"（已使用）";font-weight:400}
.empty{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>旅行隨身筆記本</h1>
      <div class="tr">
        <button class="chip" id="sync-chip" onclick="$('dm').showModal()" hidden></button>
        <button class="reset" onclick="$('dm').showModal()">資料管理</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><small>行李準備</small><b id="st-prog">0 / 0</b><div class="bar"><i id="st-bar"></i></div></div>
      <div class="stat"><small>累計花費（台幣）</small><b id="st-total">NT$0</b></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="view-checklist">
    <h2>行李與準備清單</h2>
    <div class="add"><input type="text" id="checklist-input" placeholder="例如：護照、充電線" aria-label="新增準備項目" enterkeyhint="done"><button class="btn" onclick="addItem()"><i data-ic="plus"></i>新增</button></div>
    <div id="checklist-items"></div>
  </section>

  <section id="view-notes" hidden>
    <h2>生活小筆記</h2>
    <div class="panel">
      <label class="f">標題（選填）<input type="text" id="note-title" placeholder="例如：護照影本位置、訂房編號"></label>
      <label class="f">內容<textarea id="note-text" placeholder="寫下需要記住的重要事情"></textarea></label>
      <label class="f">提醒時間（選填）<input type="datetime-local" id="note-remind"></label>
      <label class="f">提醒時區<select id="note-tz"></select></label>
      <label class="pick"><i data-ic="camera"></i><span>拍照或選擇照片（可多張，選填）</span><input type="file" id="note-photo" accept="image/*" multiple></label>
      <div class="pv" id="note-photo-pv"></div>
      <label class="pick"><i data-ic="note"></i><span>附加文件（PDF、Word 等，選填）</span><input type="file" id="note-file" data-kind="file" multiple></label>
      <div class="pv" id="note-file-pv"></div>
      <button class="btn" onclick="addNote(this)">儲存筆記</button>
    </div>
    <div id="notes-items"></div>
  </section>

  <section id="view-souvenirs" hidden>
    <h2>伴手禮記錄</h2>
    <div class="panel">
      <label class="f">對象 / 物品名稱<input type="text" id="souvenir-name" placeholder="例如：給家人的鳳梨酥"></label>
      <label class="pick"><i data-ic="camera"></i><span>拍照或選擇照片（可多張，選填）</span><input type="file" id="souvenir-photo" accept="image/*" multiple></label>
      <div class="pv" id="souvenir-photo-pv"></div>
      <label class="f">說明／備註（選填）<textarea id="souvenir-note" placeholder="例如：哪裡買、標價、可不可以帶回國、要送誰"></textarea></label>
      <button class="btn" onclick="addPhotoItem('souvenirs',this)">儲存伴手禮</button>
    </div>
    <div class="pshare">
      <button type="button" class="fxb" onclick="souvenirsShare()">分享清單</button>
      <button type="button" class="fxb" onclick="placeBackup('souvenirs')">備份檔（含照片）</button>
      <label class="fxb">匯入<input type="file" accept=".json,application/json" hidden onchange="importData(this.files[0],'souvenirs');this.value=''"></label>
    </div>
    <div id="souvenirs-items"></div>
  </section>

  <section id="view-expenses" hidden>
    <h2>每日記帳</h2>
    <div class="panel">
      <label class="f">消費日期<input type="date" id="expense-day"></label>
      <div class="two">
        <label class="f">花費金額<input type="number" id="expense-amount" inputmode="decimal" placeholder="輸入金額" oninput="fxPreview()"></label>
        <label class="f">幣別<select id="expense-cur" onchange="fxCurChange()"></select></label>
      </div>
      <div id="expense-fx" hidden>
        <label class="f">匯率（1 <span id="expense-fxname"></span> ＝ 幾元台幣）<input type="number" id="expense-rate" inputmode="decimal" step="any" oninput="fxPreview()"></label>
        <button type="button" class="fxb" onclick="fxUpdate(this)">取得最新匯率</button>
      </div>
      <p class="hint" id="expense-twd"></p>
      <label class="f">項目說明<input type="text" id="expense-desc" placeholder="例如：晚餐拉麵"></label>
      <label class="pick"><i data-ic="camera"></i><span>拍下收據（可多張，選填）</span><input type="file" id="expense-photo" accept="image/*" multiple></label>
      <div class="pv" id="expense-photo-pv"></div>
      <label class="pick"><i data-ic="note"></i><span>附加文件（發票、PDF 等，選填）</span><input type="file" id="expense-file" data-kind="file" multiple></label>
      <div class="pv" id="expense-file-pv"></div>
      <button class="btn" onclick="addPhotoItem('expenses',this)">新增這筆花費</button>
    </div>
    <div id="expenses-items"></div>
  </section>

  <section id="view-tickets" hidden>
    <h2>交通票券</h2>
    <div class="panel">
      <label class="pick"><i data-ic="camera"></i><span>拍下票券或 QR Code（可多張，選填）</span><input type="file" id="ticket-photo" accept="image/*" multiple></label>
      <div class="pv" id="ticket-photo-pv"></div>
      <label class="pick"><i data-ic="note"></i><span>附加文件（電子票券 PDF 等，選填）</span><input type="file" id="ticket-file" data-kind="file" multiple></label>
      <div class="pv" id="ticket-file-pv"></div>
      <label class="f">票券名稱<input type="text" id="ticket-name" placeholder="例如：東京地鐵 24 小時券"></label>
      <label class="f">使用日期（選填）<input type="date" id="ticket-date"></label>
      <label class="f">備註（選填）<input type="text" id="ticket-note" placeholder="例如：訂單編號、集合時間"></label>
      <button class="btn" onclick="addTicket(this)">儲存票券</button>
    </div>
    <div id="tickets-items"></div>
  </section>

  <section id="view-stays" hidden>
    <h2>住宿安排</h2>
    <div class="pshare">
      <button type="button" class="fxb" onclick="staysShare()">分享清單</button>
      <button type="button" class="fxb" onclick="placeBackup('stays')">備份檔</button>
      <label class="fxb">匯入<input type="file" accept=".json,application/json" hidden onchange="importData(this.files[0],'stays');this.value=''"></label>
    </div>
    <div id="stays-sum" class="hint" style="margin:0 4px 10px"></div>
    <div id="stays-items"></div>
  </section>

  <section id="view-spots" hidden>
    <h2>必逛景點</h2>
    <div class="panel">
      <label class="f">景點名稱<input type="text" id="spots-input" placeholder="輸入名稱後，自動查詢所在地" enterkeyhint="search"></label>
      <p class="hint" id="spots-hint"></p>
      <div class="cands" id="spots-cands"></div>
      <div class="two">
        <label class="f">國家<input type="text" id="spots-country" list="countries" placeholder="自動帶入"></label>
        <label class="f">區域<input type="text" id="spots-region" placeholder="自動帶入"></label>
      </div>
      <label class="f">地址<input type="text" id="spots-address" placeholder="自動帶入，可自行修改"></label>
      <label class="f">備註（選填）<input type="text" id="spots-note" placeholder="例如：需預約、週一休館、建議早上去"></label>
      <label class="pick"><i data-ic="camera"></i><span>拍照或選擇照片（可多張，選填）</span><input type="file" id="spots-photo" accept="image/*" multiple></label>
      <div class="pv" id="spots-photo-pv"></div>
      <button class="btn" onclick="askPlace('spots')">確認資料</button>
    </div>
    <div class="pshare">
      <button type="button" class="fxb" onclick="placeShare('spots')">分享清單</button>
      <button type="button" class="fxb" onclick="placeBackup('spots')">備份檔</button>
      <label class="fxb">匯入<input type="file" accept=".json,application/json" hidden onchange="importData(this.files[0],'spots');this.value=''"></label>
    </div>
    <div class="legend" id="spots-legend"></div>
    <div class="two filt" id="spots-filter"></div>
    <div id="spots-items"></div>
  </section>

  <section id="view-food" hidden>
    <h2>美食餐廳</h2>
    <div class="panel">
      <label class="f">餐廳名稱<input type="text" id="food-input" placeholder="輸入名稱後，自動查詢所在地" enterkeyhint="search"></label>
      <p class="hint" id="food-hint"></p>
      <div class="cands" id="food-cands"></div>
      <div class="two">
        <label class="f">國家<input type="text" id="food-country" list="countries" placeholder="自動帶入"></label>
        <label class="f">區域<input type="text" id="food-region" placeholder="自動帶入"></label>
      </div>
      <label class="f">地址<input type="text" id="food-address" placeholder="自動帶入，可自行修改"></label>
      <label class="f">備註（選填）<textarea id="food-note" placeholder="例如：招牌菜、需預約、營業時間、人均價位，想補充的內容都可以寫"></textarea></label>
      <label class="pick"><i data-ic="camera"></i><span>拍照或選擇照片（可多張，選填）</span><input type="file" id="food-photo" accept="image/*" multiple></label>
      <div class="pv" id="food-photo-pv"></div>
      <button class="btn" onclick="askPlace('food')">確認資料</button>
    </div>
    <div class="pshare">
      <button type="button" class="fxb" onclick="placeShare('food')">分享清單</button>
      <button type="button" class="fxb" onclick="placeBackup('food')">備份檔</button>
      <label class="fxb">匯入<input type="file" accept=".json,application/json" hidden onchange="importData(this.files[0],'food');this.value=''"></label>
    </div>
    <div class="legend" id="food-legend"></div>
    <div class="two filt" id="food-filter"></div>
    <div id="food-items"></div>
  </section>
  <section id="view-map" hidden>
    <h2>行程地圖</h2>
    <div class="msearch">
      <input type="text" id="map-q" placeholder="輸入地點名稱搜尋（例如：Rovaniemi 聖誕老人村）" enterkeyhint="search" onkeydown="if(event.key==='Enter')mapSearch()">
      <button type="button" class="btn" onclick="mapSearch()">搜尋</button>
    </div>
    <div class="mres" id="map-res"></div>
    <div class="mchips" id="map-chips"></div>
    <div id="tmap"></div>
    <div class="mchips" id="map-layers" style="margin:10px 0 0"></div>
    <p class="hint" id="map-status" style="margin:10px 4px"></p>
    <div class="pshare">
      <button type="button" class="fxb" onclick="mapDraw(true)">顯示全部地點</button>
      <button type="button" class="fxb" onclick="mapGeocode(true)">重新定位</button>
    </div>
    <h2 style="margin-top:22px;display:flex;align-items:center;gap:8px"><span class="pp-i" style="background:#2F6DB5;width:28px;height:28px;margin:0"><i data-ic="train"></i></span>交通地點</h2>
    <div class="pshare">
      <button type="button" class="fxb" onclick="placeShare('transit')">分享清單</button>
      <button type="button" class="fxb" onclick="placeBackup('transit')">備份檔</button>
      <label class="fxb">匯入<input type="file" accept=".json,application/json" hidden onchange="importData(this.files[0],'transit');this.value=''"></label>
    </div>
    <div id="transit-items"></div>
  </section>
</main>

<nav aria-label="主選單">
  <button data-tab="checklist" aria-current="page"><i data-ic="list"></i>準備清單</button>
  <button data-tab="souvenirs"><i data-ic="gift"></i>伴手禮</button>
  <button data-tab="expenses"><i data-ic="wallet"></i>記帳</button>
  <button data-tab="tickets"><i data-ic="ticket"></i>票券</button>
  <button data-tab="stays"><i data-ic="bed"></i>住宿</button>
  <button data-tab="spots"><i data-ic="pin"></i>景點</button>
  <button data-tab="food"><i data-ic="utensils"></i>餐廳</button>
  <button data-tab="map"><i data-ic="map"></i>地圖</button>
  <button data-tab="notes"><i data-ic="note"></i>生活筆記</button>
</nav>
<div id="alarm" aria-live="assertive"></div>

<datalist id="countries"><option value="台灣"><option value="日本"><option value="韓國"><option value="泰國"><option value="越南"><option value="新加坡"><option value="馬來西亞"><option value="香港"><option value="中國"><option value="美國"><option value="英國"><option value="法國"><option value="義大利"><option value="德國"><option value="西班牙"><option value="澳洲"></datalist>

<dialog id="cf">
  <h2 id="cf-title">確認資料</h2>
  <dl class="cfl"><dt>名稱</dt><dd id="cf-name"></dd><dt>國家</dt><dd id="cf-country"></dd><dt>區域</dt><dd id="cf-region"></dd><dt>地址</dt><dd id="cf-address"></dd><dt id="cf-note-t">備註</dt><dd id="cf-note"></dd></dl>
  <div class="dact">
    <button class="btn" onclick="savePlace()">確認新增</button>
    <button class="btn ghost" onclick="$('cf').close()">返回修改</button>
  </div>
</dialog>

<dialog id="dm">
  <h2>資料管理</h2>
  <p class="dnote">程式版本：<b id="app-ver"></b></p>
  <div class="cloudbox" id="cloud-box" hidden>
    <b>雲端同步</b>
    <p class="dnote" id="cloud-note"></p>
    <button class="btn" id="cloud-btn" onclick="cloudBtn()">使用 Google 登入</button>
    <button class="btn ghost" id="cloud-sync" onclick="Sync.now()" hidden>立即重新同步</button>
    <button class="btn ghost" id="cloud-repair" onclick="Sync.repair()" hidden>修復：重新上傳照片與文件</button>
    <button class="btn ghost" id="cloud-diag" onclick="Sync.diag()" hidden>複製診斷資訊</button>
  </div>
  <p class="dnote">資料先存在這個瀏覽器裡。換裝置或清除瀏覽資料前，記得先下載備份；登入雲端同步後，各裝置會自動共用。</p>
  <div class="dact">
    <button class="btn" onclick="exportData()">下載備份檔</button>
    <label class="btn ghost">匯入備份檔<input type="file" accept=".json,application/json" hidden onchange="importData(this.files[0]);this.value=''"></label>
    <button class="btn ghost" onclick="printAll()">列印 / 存成 PDF</button>
    <button class="btn ghost danger" onclick="clearData()">清除所有資料</button>
    <button class="btn ghost" onclick="$('dm').close()">關閉</button>
  </div>
</dialog>

<dialog id="ed">
  <h2 id="ed-title">編輯</h2>
  <div class="panel" id="ed-body"></div>
  <div class="dact">
    <button class="btn" id="ed-save" onclick="saveEdit()">儲存修改</button>
    <button class="btn ghost" onclick="$('ed').close()">取消</button>
  </div>
</dialog>

<dialog id="lb" aria-label="檢視照片或文件">
  <div class="vbody" id="vw-body" onclick="if(event.target===this)$('lb').close()"></div>
  <div class="vbar"><button type="button" class="vb main" onclick="$('lb').close()">← 返回</button><span class="vt" id="vw-title"></span><button type="button" class="vb" id="vw-act" hidden></button></div>
</dialog>

const sig=x=>JSON.stringify(Object.assign({},x,{u:0}));
// --- IndexedDB 底層 ---
const MEM={},STORE_KEYS=['checklist','souvenirs','expenses','tickets','spots','food','notes','stays','transit'];
let IDB=null,idbChain=Promise.resolve(),idbWarned=false;
function idbOpen(){
  return new Promise(res=>{
    try{
      if(!window.indexedDB)return res(null);
      const rq=indexedDB.open('travel-notebook',1);
      rq.onupgradeneeded=()=>{if(!rq.result.objectStoreNames.contains('kv'))rq.result.createObjectStore('kv')};
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=rq.onblocked=()=>res(null);
      setTimeout(()=>res(null),5000);
    }catch(e){res(null)}
  });
}
function idbTx(mode,fn){
  return new Promise((res,rej)=>{
    const tx=IDB.transaction('kv',mode);let rq;
    tx.oncomplete=()=>res(rq&&rq.result);
    tx.onerror=tx.onabort=()=>rej(tx.error||new Error('idb'));
    rq=fn(tx.objectStore('kv'));
  });
}
// 寫入排隊進行，且永遠寫「當下最新」的內容，連續修改不會重複寫舊的大資料
function persistKey(k){
  idbChain=idbChain.then(()=>{if(MEM[k]==null)return;return idbTx('readwrite',st=>st.put(MEM[k],k))}).catch(e=>{
    console.error('IndexedDB 寫入失敗',e);
    if(!idbWarned){idbWarned=true;alert('資料寫入手機儲存空間失敗，請釋出一些手機空間後再試。')}
  });
}
async function storeInit(){
  IDB=await idbOpen();
  if(!IDB)return;                                  // 不支援（如部分無痕模式）→ 退回 LocalStorage
  try{
    for(const k of STORE_KEYS){
      const v=await idbTx('readonly',st=>st.get(k));
      if(typeof v==='string')MEM[k]=v;
      // 把舊版存在 LocalStorage 的資料搬進 IndexedDB，成功後刪掉舊的，釋放空間
      const ls=localStorage.getItem('travel_'+k);
      if(ls!=null){
        if(MEM[k]==null){
          await idbTx('readwrite',st=>st.put(ls,k));
          MEM[k]=ls;
        }
        try{localStorage.removeItem('travel_'+k)}catch(e){}
      }
    }
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }catch(e){
    console.error('IndexedDB 讀取失敗，改用 LocalStorage',e);
    IDB=null;
  }
}
const Store={
  // 資料存在 IndexedDB（容量遠大於 LocalStorage 的 5 MB），執行時放在記憶體 MEM 裡同步讀取
  ready:null,
  get:k=>{try{return JSON.parse((IDB?MEM[k]:localStorage.getItem('travel_'+k))||'[]').map(norm)}catch(e){return[]}},
  // 寫入但不標記為「本機修改」（套用雲端資料時用）
  raw:(k,d)=>{
    try{
      const s=JSON.stringify(d);
      if(IDB){MEM[k]=s;persistKey(k);return true}
      localStorage.setItem('travel_'+k,s);return true;
    }catch(e){return false}
  },
  size:()=>Object.values(MEM).reduce((n,v)=>n+(v||'').length,0),
  clearAll:()=>{
    Object.keys(MEM).forEach(k=>delete MEM[k]);
    if(!IDB)return Promise.resolve();
    idbChain=idbChain.then(()=>idbTx('readwrite',st=>st.clear())).catch(e=>console.error(e));
    return idbChain;
  },
  // 一般寫入：有變動的項目更新版本時間，被刪掉的項目記下刪除時間（同步用）
  set:(k,d)=>{
    const now=Date.now(),old=new Map(Store.get(k).map(x=>[String(x.id),x])),seen=new Set(),tomb=jget('travel__tomb',{});
    d.forEach(x=>{const id=String(x.id),o=old.get(id);seen.add(id);x.u=(!o||sig(o)!==sig(x))?Math.max(now,(o?o.u:0)+1):o.u});
    old.forEach((o,id)=>{if(!seen.has(id))tomb[k+'_'+id]={t:k,i:o.id,u:Math.max(now,(o.u||0)+1)}});
    if(!Store.raw(k,d)){alert('儲存空間已滿，請刪除部分舊照片後再試。');return false}
    jset('travel__tomb',tomb);Sync.dirty();return true;
  }
};

// 壓縮照片
function compressImage(file,cb,maxW=600,q=.6){
  const r=new FileReader();
  r.onerror=()=>cb(null);
  r.onload=e=>{
    const img=new Image();
    img.onerror=()=>cb(null);
    img.onload=()=>{
      const s=Math.min(1,maxW/img.width),c=document.createElement('canvas');
      c.width=img.width*s;c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',q));
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

// 依序壓縮多張照片，回傳 dataURL 陣列
function compressMany(files,maxW,q){
  let bad=0;
  return files.reduce((p,f)=>p.then(arr=>new Promise(r=>compressImage(f,img=>{img?arr.push(img):bad++;r(arr)},maxW,q))),Promise.resolve([]))

}

// === 文件附件：讀成 dataURL 存起來（單一檔案上限 1.5 MB）===
const MAX_FILE=1.5*1024*1024;
function readFiles(list){
  const bad=[];
  return list.reduce((p,f)=>p.then(arr=>{
    if(f.size>MAX_FILE){bad.push(f.name);return arr}
    return new Promise(res=>{
      const r=new FileReader();
      r.onload=()=>{arr.push({name:f.name,type:f.type||'',size:f.size,data:r.result});res(arr)};
      r.onerror=()=>{bad.push(f.name);res(arr)};
      r.readAsDataURL(f);
    });
  }),Promise.resolve([])).then(arr=>{
    if(bad.length)alert('這些檔案太大或無法讀取，已略過（單一檔案上限 1.5 MB）：\n'+bad.join('\n'));
    return arr;
  });
}

  const [h,b]=url.split(','),mime=type||(h.match(/:(.*?);/)||[])[1]||'application/octet-stream',bin=atob(b),u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:mime});
}

const looked={},busy={},cands={};
function toPlace(r){
  const a=r.address||{},parts=(r.display_name||'').split(/,\s*/);
  const city=a.city||a.town||a.village||a.county||'',sub=a.suburb||a.city_district||a.quarter||a.neighbourhood||'';
  const state=/[臺台]灣省/.test(a.state||'')?'':(a.state||'');
  return{
    name:r.name||parts[0],
    country:a.country||'',
    region:[...new Set([state,city,sub].filter(Boolean))].join(' '),
    address:parts.slice(1,-1).join('，'),
    lat:r.lat?+r.lat:null,lng:r.lon?+r.lon:null
  };
}
const pickedGeo={};
function applyCand(t,i){
  const c=cands[t][i];if(!c)return;
  pickedGeo[t]={addr:c.address,lat:c.lat,lng:c.lng};
  $(t+'-country').value=c.country;$(t+'-region').value=c.region;$(t+'-address').value=c.address;
  $(t+'-hint').textContent='已自動帶入：'+[c.country,c.region].filter(Boolean).join('，')+(cands[t].length>1?'。不是這裡？請點選下方更換。':'。');
  $(t+'-cands').innerHTML=cands[t].length>1?cands[t].map((x,k)=>`<button type="button" class="cand" aria-pressed="${k===i}" onclick="applyCand('${t}',${k})">${esc(x.name)}<small>${esc([x.country,x.region].filter(Boolean).join('，')||'未提供地區')}</small></button>`).join(''):'';
}
async function lookup(t){
  const q=$(t+'-input').value.trim();
  if(q.length<2||looked[t]===q)return;
  looked[t]=q;
  $(t+'-hint').textContent='查詢所在地中…';$(t+'-cands').innerHTML='';
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&accept-language=zh-TW&q='+encodeURIComponent(q));
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    if($(t+'-input').value.trim()!==q)return;
    cands[t]=j.map(toPlace);
    if(!cands[t].length){$(t+'-hint').textContent='找不到這個地點。可以加上城市或地區再試一次，或直接手動填寫。';return}
    applyCand(t,0);
  }catch(e){$(t+'-hint').textContent='目前無法自動查詢（可能沒有網路），請手動填寫國家與區域。'}
}
const startLookup=t=>(busy[t]=lookup(t));

let vwUrl=null;
function viewOpen(o){
  const dlg=$('lb'),body=$('vw-body'),act=$('vw-act');
  body.innerHTML='';act.hidden=true;act.onclick=null;$('vw-title').textContent=o.title||'';
  if(o.img){
    const im=new Image();im.alt=o.title||'照片';im.src=o.img;body.appendChild(im);
    act.hidden=false;act.textContent=navigator.canShare?'分享照片':'下載照片';
    act.onclick=async()=>{
      try{
        const b=await (await fetch(o.img)).blob(),name='photo-'+Date.now()+'.'+((b.type.split('/')[1]||'jpg').replace('jpeg','jpg')),f=new File([b],name,{type:b.type});
        if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});
        else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
      }catch(e){}
    };
  }
  else if(o.blob){
    const b=o.blob,name=o.title||'檔案';vwUrl=URL.createObjectURL(b);
    const share=()=>{
      const f=new File([b],name,{type:b.type||'application/octet-stream'});
      if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:name}).catch(()=>{});
      else{const a=document.createElement('a');a.href=vwUrl;a.download=name;document.body.appendChild(a);a.click();a.remove()}
    };
    act.hidden=false;act.textContent=(navigator.canShare?'分享／用其他 App 開啟':'下載');act.onclick=share;
    if(/pdf/.test(b.type)){const fr=document.createElement('iframe');fr.src=vwUrl+'#view=FitH';fr.title=name;body.appendChild(fr)}
    else if(/^image\//.test(b.type)){const im=new Image();im.alt=name;im.src=vwUrl;body.appendChild(im)}
    else if(/^text\//.test(b.type)){const pre=document.createElement('pre');body.appendChild(pre);b.text().then(t=>pre.textContent=t)}
    else{body.innerHTML=`<div class="vmsg"><div>這種檔案無法直接預覽。</div><div>${esc(name)}</div></div>`}
  }
  if(!dlg.open){dlg.showModal();try{history.pushState({vw:1},'')}catch(e){}}   // 手機的返回鍵／滑動返回，也會先關閉檢視器
}

  {k:'sat',label:'衛星',url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',o:{maxZoom:19,attribution:'圖磚 © Esri, Maxar, Earthstar Geographics'}}
];

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function geoQueries(t,i){
  const j=a=>a.filter(Boolean).join(' ');
  if(t==='stays'){
    const en=((i.name||'').match(/\(([^)]+)\)/)||[])[1],plain=(i.name||'').replace(/\([^)]*\)|[①②③④⑤]/g,'').trim();
    return[
      [/different locations/i.test(i.address||'')?'':i.address,0],
      [en&&j([en,i.city]),0],[j([plain,i.city]),0],[i.city,1]
    ].filter(x=>x[0]);
  }
  return[[j([i.name,i.region,i.country]),0],[i.address&&j([i.name,i.address]),0],[j([i.region,i.country]),1]].filter(x=>x[0]);
}
async function nomi(q){
  const wait=1100-(Date.now()-geoLast);if(wait>0)await sleep(wait);
  geoLast=Date.now();
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=zh-TW&q='+encodeURIComponent(q));
  if(!r.ok)throw new Error(r.status);
  const a=await r.json();return a[0]?{lat:+a[0].lat,lng:+a[0].lon}:null;
}
async function mapGeocode(retry){
  if(geoBusy)return;
  if(retry)jset('travel__geofail',{});
  const fail=jget('travel__geofail',{}),todo=[];
  Object.keys(MAPT).forEach(t=>Store.get(t).forEach(i=>{if(!(i.lat&&i.lng)&&!fail[t+'_'+i.id])todo.push([t,i])}));
  if(!todo.length){mapStatus();return}
  geoBusy=true;let n=0;
  for(const [t,i] of todo){
    mapStatus(`定位中 ${++n} / ${todo.length}：${i.name}`);
    let hit=null;
    try{for(const [q,approx] of geoQueries(t,i)){hit=await nomi(q);if(hit){hit.approx=!!approx;break}}}
    catch(e){geoBusy=false;mapStatus('目前無法定位（可能沒有網路或查詢太頻繁），稍後再試。');return}
    if(hit){
      const d=Store.get(t),it=d.find(x=>x.id===i.id);
      if(it){it.lat=hit.lat;it.lng=hit.lng;if(hit.approx)it.geoApprox=true;Store.set(t,d)}
    }else{fail[t+'_'+i.id]=1;jset('travel__geofail',fail)}
    mapDraw();
  }
  geoBusy=false;mapStatus();
}

function hashStr(str){  // 照片內容指紋：同一張照片只上傳一次
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)+str.length.toString(36);
}

const Sync=(()=>{

  async function uploadAtt(key,it,force){

      for(const [key,tb] of Object.entries(jget('travel__tomb',{}))){
        if(tb.u<=getSync(key))continue;
        try{await T(Cloud.putItem(uid,key,{t:tb.t,d:'',ids:[],u:tb.u,del:true}));setSync(key,tb.u)}catch(e){console.error(e);logErr('上傳刪除記錄',e);fail=fail||e}
      }
    }catch(e){console.error(e);logErr('上傳',e);fail=fail||e}
    finally{pushing=false}
    if(fail){                       // 失敗：顯示原因，並自動重試（間隔逐次拉長，最長 2 分鐘）
      setStatus('err',fail.code||fail.message);
      retryMs=Math.min((retryMs||window.__RETRY||10000)*2,120000);
      retryT=setTimeout(pushAll,retryMs);
    }else{
      retryMs=0;
      applyErr?setStatus('err',applyErr):setStatus('ok');
    }
    if(again){again=false;schedule()}
  }
  function schedule(){if(!uid)return;clearTimeout(timer);timer=setTimeout(pushAll,700)}

  async function applyChange(c){
    if(c.type==='removed')return false;
    const r=c.data,key=c.id,type=r.t;if(!KEYS.includes(type))return false;
    const idn=key.slice(type.length+1);
    let local=Store.get(type).find(x=>String(x.id)===idn);
    if(r.del){
      if(local&&local.u>r.u)return false;               // 本機比較新：以本機為準（稍後會上傳）
      setTomb(key,type,Number(idn),r.u);setSync(key,r.u);clearPh(key);
      if(local){Store.raw(type,Store.get(type).filter(x=>String(x.id)!==idn));return true}
      return false;
    }
    if(local&&local.u>=r.u){if(local.u===r.u)setSync(key,r.u);return false}
    const tb=jget('travel__tomb',{})[key];
    if(tb&&tb.u>=r.u)return false;                       // 本機較晚刪除過
    const have={};(local?local.images||[]:[]).forEach(im=>have[hashStr(im)]=im);
    const images=[];
    for(const h of r.ids||[]){
      let d=have[h]||await T(Cloud.getPhoto(uid,h));
      if(!d)throw Object.assign(new Error('找不到雲端照片'),{code:'missing-photo'});
      images.push(d);
    }
    const haveF={};(local?local.files||[]:[]).forEach(f=>haveF[hashStr(f.data)]=f);
    const files=[];
    for(const m of r.fs||[]){
      let f=haveF[m.h];
      if(!f){
        let data='';
        for(let k=0;k<m.c;k++){const part=await T(Cloud.getPhoto(uid,m.h+'~'+k));if(part==null)throw Object.assign(new Error('找不到雲端文件'),{code:'missing-photo'});data+=part}
        f={name:m.n,type:m.t,size:m.s,data};
      }
      files.push(f);
    }
    // 上面有等待網路，之後重新讀取最新的本機資料再寫入（中間不再等待）
    const list=Store.get(type);local=list.find(x=>String(x.id)===idn);
    if(local&&local.u>=r.u)return false;
    const item=Object.assign(JSON.parse(r.d),{u:r.u});
    if(PHOTO_TYPES.includes(type))item.images=images;
    if(FILE_TYPES.includes(type))item.files=files;
    if(local)list[list.indexOf(local)]=item;else list.push(item);
    list.sort((a,b)=>b.id-a.id);
    if(!Store.raw(type,list))throw Object.assign(new Error('本機儲存空間已滿'),{code:'quota'});
    setSync(key,r.u);
    setPh(key,images.map(hashStr).concat(files.flatMap(f=>Array.from({length:Math.max(1,Math.ceil(f.data.length/CHUNK))},(_,k)=>hashStr(f.data)+'~'+k))));
    return true;
  }
  function onChanges(changes){
    q=q.then(async()=>{
      let changed=false,err=null;
      for(const c of changes){try{if(await applyChange(c))changed=true}catch(e){console.error('套用雲端資料失敗',c.id,e);logErr('接收 '+c.id.split('_')[0],e);err=err||e}}
      if(changed){render();jset('travel__last',Date.now())}
      first=false;
      applyErr=err?(err.code||err.message):'';
      if(err)relisten(15000);        // 稍後重新取得一次（間隔逐次拉長，避免一直讀取）
      else relistenMs=0;
      pushAll();
    }).catch(e=>{console.error(e);setStatus('err',e.code||e.message);relisten(15000)});
  }
  function listen(){
    stop();first=true;
    try{unsub=Cloud.listen(uid,onChanges,e=>{console.error(e);logErr('連線監聽',e);setStatus('err',e.code||e.message);relisten(20000)})}
    catch(e){console.error(e);setStatus('err',e.message)}
  }
  function stop(){if(unsub){try{unsub()}catch(e){}unsub=null}clearTimeout(retry)}
  function relisten(ms){clearTimeout(retry);relistenMs=relistenMs?Math.min(relistenMs*2,300000):ms;retry=setTimeout(()=>{if(uid)listen()},relistenMs)}

  function onUser(u){
    if(!u){stop();uid=null;user=null;setStatus('out');return}
    const prev=localStorage.getItem('travel__uid');
    if(prev&&prev!==u.uid){
      if(!confirm('這個瀏覽器目前存的是另一個帳號的資料。\n登入「'+(u.email||'這個帳號')+'」後，會換成這個帳號的雲端資料。\n（原本帳號的資料仍保留在它的雲端，之後登入還能取回。）\n\n要繼續嗎？')){Cloud.signOut();return}
      Object.keys(localStorage).filter(k=>k.startsWith('travel_')).forEach(k=>localStorage.removeItem(k));
      Store.clearAll();
      render();
    }
    localStorage.setItem('travel__uid',u.uid);
    uid=u.uid;user=u;setStatus('sync');listen();
  }
  async function boot(){
    if(!CLOUD_ON||booted)return;
    if(!navigator.onLine){paint();return}
    try{if(!window.__CLOUD)await Cloud.load();booted=true;Cloud.onAuth(onUser)}
    catch(e){console.error(e);setStatus('err','無法連上雲端服務')}
  }
  return {
    init(){paint();boot();
      window.addEventListener('online',()=>{if(!booted)boot();else if(uid){listen();pushAll()}paint()});
      window.addEventListener('offline',paint);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden&&uid)pushAll()});
    },
    dirty(){if(CLOUD_ON)schedule()},
    now(){if(!uid)return;retryMs=0;relistenMs=0;applyErr='';listen();pushAll()},
    // 修復：把這台裝置上所有項目的照片與文件重新上傳一次（不動項目本身，所以不會蓋掉別台的新修改）
    async repair(){
      if(!uid)return;
      if(!confirm('這會把這台裝置上所有項目的照片與文件重新上傳到雲端，用來修復「雲端找不到照片或文件」。\n資料多的話會花一些時間和流量。要繼續嗎？'))return;
      pushing=true;setStatus('sync');let bad=null;
      try{
        for(const type of KEYS)for(const it of Store.get(type)){
          if(!(it.images||[]).length&&!(it.files||[]).length)continue;
          try{await uploadAtt(type+'_'+it.id,it,true)}catch(e){logErr('修復 '+type,e);bad=bad||e}
        }
      }finally{pushing=false}
      bad?setStatus('err',bad.code||bad.message):setStatus('ok');
      relistenMs=0;listen();pushAll();
      alert(bad?'有部分照片或文件重傳失敗：'+errText(bad.code||bad.message):'重新上傳完成。另一台裝置會在稍後自動補齊。');
    },
    // 診斷資訊：一鍵複製，貼給開發者就能看出卡在哪
    diag(){
      const un=[];
      for(const type of KEYS)for(const it of Store.get(type)){
        if(it.u>getSync(type+'_'+it.id))un.push(type+'：照片 '+(it.images||[]).length+'、文件 '+(it.files||[]).length+'、約 '+Math.round(JSON.stringify(it).length/1024)+' KB');
      }
      const used=Store.size()+Object.keys(localStorage).filter(k=>k.startsWith('travel_')).reduce((n,k)=>n+(localStorage.getItem(k)||'').length,0);
      const txt=JSON.stringify({版本:APP_VERSION,狀態:status,錯誤:errText(lastErr),錯誤代碼:lastErr,已登入:!!uid,網路:navigator.onLine,儲存方式:IDB?'IndexedDB':'LocalStorage（舊式，上限約 5 MB）',本機已用字元:used,尚未同步的項目:un,最近錯誤:LOG},null,1);
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>alert('已複製診斷資訊，請貼給我。')).catch(()=>prompt('請全選並複製這段文字：',txt));
    },
    signedIn:()=>!!uid,
    async signIn(){if(!booted){await boot()}if(!booted)throw new Error('離線或無法連上雲端服務');return Cloud.signIn()},
    signOut:()=>Cloud.signOut(),
    async wipeCloud(){
      const now=Date.now(),seen=new Set();
      const put=(key,t)=>{seen.add(key);return Cloud.putItem(uid,key,{t,d:'',ids:[],u:now,del:true})};
      for(const it of await Cloud.listItems(uid)){if(it.data&&!it.data.del)await put(it.id,it.data.t)}
      for(const type of KEYS)for(const it of Store.get(type)){const k=type+'_'+it.id;if(!seen.has(k))await put(k,type)}
      await Cloud.deletePhotos(uid);
    }
  };
})();

function cloudBtn(){
  if(Sync.signedIn()){
    if(confirm('要登出嗎？\n登出後這個瀏覽器上的資料還在，但不會再同步。'))Sync.signOut();
    return;
  }
  if(/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent)){
    alert('Google 不允許在 LINE、Facebook、Instagram 這類 App 內建的瀏覽器登入。\n請點右上角選單，選「用 Safari（或 Chrome）開啟」後再登入。');return;
  }
  Sync.signIn().catch(e=>{
    const m={'auth/unauthorized-domain':'這個網址還沒加入 Firebase 的「授權網域」，請到 Firebase 控制台 → Authentication → 設定 → 授權網域，把目前網址加進去。',
             'auth/network-request-failed':'網路連線失敗，請稍後再試。'}[e.code];
    alert('登入失敗：'+(m||e.code||e.message));
  });
}

// === 初始化 ===
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
$('checklist-input').addEventListener('keydown',e=>{if(e.key==='Enter')addItem()});
['spots','food'].forEach(t=>{
  const l=lastLoc();$(t+'-country').value=l.country||'';$(t+'-region').value=l.region||'';
  $(t+'-input').addEventListener('change',()=>startLookup(t));
  $(t+'-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$(t+'-input').blur();startLookup(t)}});
  ['country','region','address','note'].forEach(k=>$(t+'-'+k)&&$(t+'-'+k).addEventListener('keydown',e=>{if(e.key==='Enter')askPlace(t)}));
});
tzOptions($('note-tz'),jget('travel__tz',DEV_TZ));
$('app-ver').textContent=APP_VERSION;
['ticket-photo','ticket-file','souvenir-photo','expense-photo','expense-file','note-photo','note-file','spots-photo','food-photo'].forEach(pickerInit);
setInterval(checkAlarms,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkAlarms()});
try{localStorage.removeItem('travel_ocr_ok')}catch(e){}
Store.ready.catch(()=>{}).then(()=>{render();Sync.init()});
</script>
